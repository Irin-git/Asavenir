name: Rappels épreuves (Chantier 3)

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  workflow_dispatch:        # permet aussi un déclenchement manuel depuis l'onglet Actions de GitHub

jobs:
  appeler-rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'endpoint de rappels
        run: curl -sf --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://asavenir.infinityfree.io/api/index.php/cron_rappels?cle=${{ secrets.CRON_SECRET_KEY }}"
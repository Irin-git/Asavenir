<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Épreuves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand mb-0 h1">Mes Épreuves</span>
    </nav>

    <div class="container mt-4">
        <div id="liste-epreuves" class="d-flex flex-column gap-3">
            <!-- Les cartes d'épreuves seront injectées ici par JS -->
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        async function chargerEpreuves() {
            try {
                const res = await fetch('http://localhost/concours_fp/api/index.php/epreuves?mes_epreuves=1', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                const epreuves = await res.json();
                const conteneur = document.getElementById('liste-epreuves');
                conteneur.innerHTML = '';

                if (epreuves.length === 0) {
                    conteneur.innerHTML = '<p class="text-muted">Aucune épreuve disponible pour le moment.</p>';
                    return;
                }

                epreuves.forEach(ep => {
                    const carte = document.createElement('div');
                    carte.className = 'card shadow-sm';

                    const dateFormatee = new Date(ep.date_epreuve).toLocaleString('fr-FR');

                    carte.innerHTML = `
                        <div class="card-body">
                            <h5 class="card-title">${ep.titre}</h5>
                            <p class="card-text mb-1"><strong>Concours :</strong> ${ep.concours_titre}</p>
                            <p class="card-text mb-1"><strong>Type :</strong> ${ep.type}</p>
                            <p class="card-text mb-1"><strong>Durée :</strong> ${ep.duree} min</p>
                            <p class="card-text mb-2"><strong>Date :</strong> ${dateFormatee}</p>
                            ${ep.est_exclu == 1
                                ? `<button class="btn btn-dark w-100" disabled>🚫 Exclu(e) de l'épreuve</button>`
                                : ep.deja_soumise == 1
                                    ? `<button class="btn btn-danger w-100" disabled>✅ Épreuve déjà soumise</button>`
                                    : ep.est_accessible == 1
                                        ? `<button class="btn btn-success w-100" onclick="window.location.href='passer_epreuves.html?id=${ep.id}&candidature_id=${ep.candidature_id}'">Passer l'épreuve</button>`
                                        : `<button class="btn btn-secondary w-100" disabled>Pas encore accessible</button>`
                            }
                        </div>
                    `;

                    conteneur.appendChild(carte);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('liste-epreuves').innerHTML = '<p class="text-danger">Erreur de chargement des épreuves.</p>';
            }
        }

        chargerEpreuves();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concours FP — Espace Jury</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #1a3a6b; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .reponse-card { border-left: 4px solid #1a3a6b; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">🏛️ Espace Jury</span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-white" id="nomJury"></span>
      <button class="btn btn-outline-light btn-sm" onclick="deconnexion()">Déconnexion</button>
    </div>
  </nav>

  <div class="container py-4">

    <!-- ===== Candidatures à examiner (avis consultatif avant décision finale de l'admin) ===== -->
    <div class="card p-4 mb-4">
      <h6 class="fw-bold mb-3">🗂️ Candidatures à examiner</h6>
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th>Candidat</th>
              <th>Concours</th>
              <th>Date</th>
              <th>Avis</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableauCandidaturesJury">
            <tr><td colspan="6" class="text-center text-muted py-4">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Le jury choisit d'abord le concours, puis l'épreuve à corriger -->
    <div class="card p-4 mb-4">
      <h6 class="fw-bold mb-3">📋 Sélectionner une épreuve à corriger</h6>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Concours</label>
          <select class="form-select" id="selectConcoursJury" onchange="chargerEpreuvesJury()">
            <option value="">Chargement...</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Épreuve</label>
          <select class="form-select" id="selectEpreuveJury" onchange="chargerReponsesJury()">
            <option value="">Sélectionnez d'abord un concours</option>
          </select>
        </div>
      </div>
    </div>

    <div id="alertMsgJury"></div>

    <!-- Copies à corriger pour l'épreuve sélectionnée, en mode anonyme -->
    <div id="zoneReponsesJury"></div>

  </div>

  <script src="js/jury.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du résultat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; padding: 30px 15px; }
    .form-card {
      background: #fff; border-radius: 10px; padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-width: 700px; margin: 0 auto;
    }
    .section-title { font-weight: 700; font-size: 20px; margin-bottom: 18px; }
    .badge-mention { font-size: 14px; padding: 6px 14px; }
  </style>
</head>
<body>

  <div class="form-card">
    <a href="admin.html" class="btn btn-sm btn-outline-secondary mb-3">← Retour aux résultats</a>
    <p class="section-title">🏆 Détail du résultat</p>

    <div id="contenuDetail">
      <p class="text-muted text-center py-4">Chargement...</p>
    </div>
  </div>

  <script>
    const API = '/concours_fp/api/index.php';
    const token = localStorage.getItem('token');

    // on récupère l'id du candidat passé dans l'URL (?id=...)
    const params = new URLSearchParams(window.location.search);
    const candidatureId = params.get('id');

    const badgeCouleur = {
      'Admis': 'bg-success',
      'Ajourné': 'bg-warning text-dark',
      'Rejeté': 'bg-danger'
    };

    async function chargerDetail() {
      const zone = document.getElementById('contenuDetail');

      if (!candidatureId) {
        zone.innerHTML = '<p class="text-danger text-center py-4">Aucun candidat spécifié.</p>';
        return;
      }

      try {
        const res = await fetch(`${API}/resultats?detail_candidat=${candidatureId}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          zone.innerHTML = '<p class="text-danger text-center py-4">Résultat introuvable.</p>';
          return;
        }

        const c = await res.json();
        const couleur = badgeCouleur[c.mention] || 'bg-secondary';

        // on construit les lignes du tableau épreuve par épreuve
        let lignes = '';
        c.epreuves.forEach(ep => {
          lignes += `
            <tr>
              <td>${ep.titre}</td>
              <td>${ep.note_sur_20} / 20</td>
              <td>${ep.coefficient}</td>
            </tr>
          `;
        });

        zone.innerHTML = `
          <div class="mb-4">
            <h5 class="fw-bold mb-1">${c.prenom} ${c.nom}</h5>
            <p class="text-muted mb-2">${c.email}</p>
            <p class="mb-1"><strong>Concours :</strong> ${c.titre_concours}</p>
            <p class="mb-1"><strong>Rang :</strong> ${c.rang}</p>
            <span class="badge badge-mention ${couleur}">${c.mention}</span>
            <span class="fw-bold ms-2">${c.note_totale} / 20</span>
          </div>

          <table class="table table-bordered">
            <thead>
              <tr><th>Épreuve</th><th>Note</th><th>Coefficient</th></tr>
            </thead>
            <tbody>${lignes}</tbody>
          </table>
        `;
      } catch (err) {
        zone.innerHTML = '<p class="text-danger text-center py-4">Erreur lors du chargement.</p>';
      }
    }

    chargerDetail();
  </script>
</body>
</html>

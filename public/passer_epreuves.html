<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passer l'épreuve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Épreuve en cours</span>
  </nav>

  <!-- Sas d'entrée : le candidat doit cliquer pour passer en plein écran avant de voir les questions -->
  <div id="ecran-demarrage" class="container mt-5 text-center d-none">
    <div class="card shadow-sm p-5">
      <h4 class="mb-3">Prêt à commencer l'épreuve ?</h4>
      <p class="text-muted">
        L'épreuve va s'ouvrir en <strong>mode plein écran</strong>.
        Ne quittez pas cette fenêtre pendant l'examen.
      </p>
      <button id="btn-commencer" class="btn btn-success btn-lg mt-3" onclick="commencerEpreuve()">
        Commencer l'épreuve
      </button>
    </div>
  </div>

  <!-- Questions + minuteur, affiché uniquement une fois le plein écran actif -->
  <div id="zone-epreuve" class="container mt-4 mb-5 d-none">
    <div id="minuteur" class="alert alert-info text-center fw-bold fs-4 sticky-top">
      Temps restant : <span id="minuteur-texte">--h --min --s</span>
    </div>
    <div id="questions-container" class="d-flex flex-column gap-4">
      <!-- Injecté par passer_epreuves.js -->
    </div>
    <button id="btn-soumettre" class="btn btn-primary w-100 mt-4" onclick="soumettreEpreuve()">
      Soumettre l'épreuve
    </button>
  </div>

  <script src="js/passer_epreuves.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier Candidat — Asavenir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/dossier.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="brand-badge">
      <div class="glyph">A</div>
      <div class="brand-text">
        <span class="name">Asavenir</span>
        <span class="tag">Dossier candidat</span>
      </div>
    </div>
    <button class="btn-close-dossier" onclick="window.close()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Fermer
    </button>
  </nav>

  <div class="dossier-hero">
    <div class="hero-shape shape-1"></div>
    <div class="hero-shape shape-2"></div>
    <span class="eyebrow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Vérification de candidature
    </span>
    <h2 id="titreCandidat">Chargement du dossier…</h2>
    <p id="infoCandidature">Consultez les pièces soumises avant de rendre une décision.</p>
  </div>

  <div class="container-dossier">
    <div id="alertMsg"></div>

    <div class="form-card">
      <div class="card-header-dossier">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        Documents soumis
      </div>
      <div id="listeDocuments">
        <p class="text-muted-center">Chargement...</p>
      </div>
    </div>

    <div class="zone-decision" id="zoneDecisionAdmin" style="display:none;">
      <button class="btn-decision btn-reject" onclick="valider('rejeté')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Rejeter
      </button>
      <button class="btn-decision btn-validate" onclick="valider('validé')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Valider
      </button>
    </div>
  </div>

  <script src="js/dossier.js?v=3"></script>
</body>
</html>

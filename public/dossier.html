<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier Candidat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #1a3a6b; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .card-header { background: #1a3a6b; color: white; border-radius: 16px 16px 0 0 !important; }
    .doc-item { border-left: 4px solid #1a3a6b; background: white; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>

  <!-- Cette page s'ouvre dans un nouvel onglet depuis admin.html, d'où le bouton "Fermer" -->
  <nav class="navbar navbar-dark px-4 py-3 d-flex justify-content-between">
    <span class="navbar-brand fw-bold">🏛️ Dossier du candidat</span>
    <button class="btn btn-outline-light btn-sm" onclick="window.close()">✖ Fermer</button>
  </nav>

  <div class="container py-4">
    <div id="alertMsg"></div>

    <!-- Infos du candidat / candidature -->
    <div class="card mb-4">
      <div class="card-header p-3">
        <h6 class="mb-0 fw-bold" id="titreCandidat">Chargement...</h6>
      </div>
      <div class="card-body">
        <p class="text-muted mb-0" id="infoCandidature">Chargement...</p>
      </div>
    </div>

    <!-- Documents déposés par le candidat (CIN, CV, diplôme...) -->
    <div class="card mb-4">
      <div class="card-header p-3">
        <h6 class="mb-0 fw-bold">📂 Documents soumis</h6>
      </div>
      <div class="card-body" id="listeDocuments">
        <p class="text-muted text-center">Chargement...</p>
      </div>
    </div>

    <!-- Décision de l'admin sur la candidature -->
    <div class="d-flex gap-3 justify-content-end">
      <button class="btn btn-danger btn-lg" onclick="valider('rejeté')">❌ Rejeter</button>
      <button class="btn btn-success btn-lg" onclick="valider('validé')">✅ Valider</button>
    </div>
  </div>

  <script src="js/dossier.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

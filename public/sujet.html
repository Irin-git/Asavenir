<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sujet — Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #1a3a6b; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .card-header { background: #1a3a6b; color: white; border-radius: 16px 16px 0 0 !important; }
    .question-card { border-left: 4px solid #1a3a6b; background: white; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .badge-type { background: #e8f0fe; color: #1a3a6b; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
  </style>
  <!-- KaTeX : rendu des formules mathématiques (Chantier 4) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
  <span class="navbar-brand fw-bold">🏛️ Aperçu du sujet</span>
  <button class="btn btn-outline-light btn-sm" onclick="window.close()">← Fermer</button>
</nav>

<div class="container py-4">
  <div id="alertMsg"></div>

  <!-- Infos épreuve -->
  <div class="card mb-4">
    <div class="card-header p-3">
      <h6 class="mb-0 fw-bold" id="titreEpreuve">Chargement...</h6>
    </div>
    <div class="card-body" id="infoEpreuve">
      <p class="text-muted">Chargement des informations...</p>
    </div>
  </div>

  <!-- Liste des questions -->
  <div class="card mb-4">
    <div class="card-header p-3">
      <h6 class="mb-0 fw-bold">❓ Questions du sujet</h6>
    </div>
    <div class="card-body" id="listeQuestions">
      <p class="text-muted text-center">Chargement...</p>
    </div>
  </div>

<script src="js/math-render.js"></script>
<script src="js/sujet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asavenir 🏛️ — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .card-header { background: #1a3a6b; color: white; border-radius: 16px 16px 0 0 !important; padding: 1.5rem 2rem; }
    .btn-primary { background: #1a3a6b; border-color: #1a3a6b; }
    .btn-primary:hover { background: #142f58; border-color: #142f58; }
    .nav-pills .nav-link.active { background: #1a3a6b; }
    .nav-pills .nav-link { color: #1a3a6b; }
    .alert { border-radius: 10px; font-size: 14px; }
    .logo-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 440px;">
    <div class="card">

      <div class="card-header text-center">
        <div class="logo-icon">🏛️</div>
        <h5 class="mb-0 fw-bold">Concours Fonction Publique</h5>
        <small style="opacity: 0.8;">Plateforme nationale de recrutement</small>
      </div>

      <div class="card-body p-4">

        <!-- Les deux onglets, showTab() dans login.js bascule juste l'affichage -->
        <ul class="nav nav-pills nav-fill mb-4" id="authTab">
          <li class="nav-item">
            <button class="nav-link active" onclick="showTab('login')">Connexion</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" onclick="showTab('register')">Inscription</button>
          </li>
        </ul>

        <div id="alertMsg"></div>

        <!-- Connexion -->
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="votre@email.com" required />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Mot de passe</label>
            <div class="input-group">
              <input type="password" class="form-control" id="loginPassword" required />
              <button type="button" class="btn btn-outline-secondary d-flex align-items-center" onclick="togglePassword('loginPassword', this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
        </form>

        <!-- Inscription, cachée au chargement -->
        <form id="registerForm" style="display:none;">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nom complet</label>
            <input type="text" class="form-control" id="regNom" placeholder="Jean Rakoto" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="regEmail" placeholder="votre@email.com" required />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Mot de passe</label>
            <div class="input-group">
              <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required />
              <button type="button" class="btn btn-outline-secondary d-flex align-items-center" onclick="togglePassword('regPassword', this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Créer mon compte</button>
        </form>

      </div>
    </div>

    <p class="text-center text-muted mt-3" style="font-size: 12px;">
      Ministère de la Fonction Publique — Plateforme sécurisée
    </p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
